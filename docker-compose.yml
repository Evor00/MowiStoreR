services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mowistore}
      POSTGRES_USER: ${POSTGRES_USER:-mowi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mowi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/core-api
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-development}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      INTERNAL_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN:-local-development-service-token}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mowi}:${POSTGRES_PASSWORD:-mowi}@db:5432/${POSTGRES_DB:-mowistore}
      DATABASE_SSL_REQUIRE: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  intelligence-payments:
    build:
      context: ./services/intelligence-payments
    environment:
      CORE_API_URL: http://api:8000
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN:-local-development-service-token}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-pen}
      CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
