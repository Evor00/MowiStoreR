name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core-api:
    name: Django tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/core-api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test apps.accounts apps.catalog apps.orders --verbosity 2

  spring-service:
    name: Spring Boot build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag mowistore-intelligence-payments ./services/intelligence-payments

  storefront:
    name: Storefront build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json
      - run: npm ci
      - run: npm run build

  admin-dashboard:
    name: Admin dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin-dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
